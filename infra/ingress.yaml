apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beflydemo
  namespace: beflydemo
  annotations:
    alb.ingress.kubernetes.io/group.name: "dev-platform"
    alb.ingress.kubernetes.io/group.order: "60"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:948881762705:certificate/051f6515-0d0b-459c-a056-0663f7c88f5e
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health

    external-dns.alpha.kubernetes.io/hostname: "internal-beflydemo.timedevops.click,api-beflydemo.timedevops.click"

spec:
  ingressClassName: alb
  rules:
    - host: internal-beflydemo.timedevops.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beflydemo
                port:
                  number: 3000

    - host: api-beflydemo.timedevops.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beflydemo
                port:
                  number: 3000

