name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPO: idp-beflydemo
      IMAGE_TAG: sha-${{ github.sha }}

      BUILD_PLATFORMS: linux/arm64

      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948881762705:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=managed-by,Value=backstage Key=app,Value=beflydemo Key=component,Value=backend \
          || true

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform ${{ env.BUILD_PLATFORMS }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t 948881762705.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} \
            -t 948881762705.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPO }}:latest \
            --push \
            ./backend

      - name: Update backend deployment manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deployment = Path("infra/deployment.yaml")
          lines = deployment.read_text().splitlines()

          in_api_container = False
          image_updated = False
          replicas_updated = False
          target_image = "948881762705.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          target_replicas = 1

          for idx, line in enumerate(lines):
              stripped = line.strip()

              if not replicas_updated and stripped.startswith("replicas: "):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[idx] = f"{indent}replicas: {target_replicas}"
                  replicas_updated = True

              if stripped == "- name: api":
                  in_api_container = True
                  continue

              if in_api_container and stripped.startswith("image: "):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[idx] = f"{indent}image: {target_image}"
                  image_updated = True
                  in_api_container = False

          if not image_updated:
              raise SystemExit("Could not locate api container image in infra/deployment.yaml")

          deployment.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/deployment.yaml
          git commit -m "ci: update backend image to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main
